name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

  backend:
    name: Backend (szintaxis ellenőrzés)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP szintaxis ellenőrzés
        run: find backend -name "*.php" -print0 | xargs -0 -n1 php -l
